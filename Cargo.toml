[package]
name = "event-studio"
version = "1.1.0"
edition = "2021"
description = "Branded event and presentation timer for Windows"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3"] }
raw-window-handle = "0.6"
ttf-parser = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace", "NSGraphics", "libc", "objc2-core-foundation"] }
global-hotkey = "0.10"

[profile.dev]
debug = 0
incremental = false

[profile.release]
opt-level = 2
strip = true
