# What `cargo about` gathers for THIRD-PARTY-LICENSES.txt: the licences of every library the
# Windows and macOS builds are made of. Made again with:
#
#   cargo install cargo-about --locked --features cli
#   cargo about generate --offline --fail -c packaging/licenses/about.toml packaging/licenses/about.hbs -o THIRD-PARTY-LICENSES.txt
#
# A library under a licence that is not listed here stops the run: it has to be looked at first.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
]
targets = ["x86_64-pc-windows-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
